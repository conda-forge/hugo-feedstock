{% set name = "hugo" %}
{% set version = "0.170.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/gohugoio/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: bfbac02de9f08914545490ef17501cb0d89e63cc95e05e51d5bd9907da20505b

build:
  number: 0
  binary_relocation: false

requirements:
  build:
    - {{ compiler('go-nocgo') }} >=1.27.4
    - {{ stdlib("c") }}  # [osx]
    - go-licenses

test:
  commands:
    - hugo help
    - hugo version
    - hugo deploy --help

about:
  home: https://gohugo.io/
  dev_url: https://github.com/gohugoio/hugo
  summary: The deploy edition of the Hugo static site generator – the world's fastest framework for building websites.
  license: Apache-2.0
  license_file:
    - LICENSE
    - library_licenses/

extra:
  recipe-maintainers:
    - moritzwilksch
    - dbast
    - agriyakhetarpal
