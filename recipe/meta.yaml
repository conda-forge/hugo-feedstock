{% set name = "hugo" %}
{% set version = "0.170.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/gohugoio/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: dac429f01212d06979a1e939307f5bffdbfd3f75a63eba0fe3c817383d0525fe

build:
  number: 1
  binary_relocation: false

requirements:
  build:
    - {{ compiler('go-nocgo') }} >=1.27.4
    - go-licenses

test:
  commands:
    - hugo help
    - hugo version
    - hugo deploy --help

about:
  home: https://gohugo.io/
  dev_url: https://github.com/gohugoio/hugo
  summary: The deploy edition of the Hugo static site generator – the world's fastest framework for building websites.
  license: Apache-2.0
  license_file:
    - LICENSE
    - library_licenses/

extra:
  recipe-maintainers:
    - moritzwilksch
    - dbast
    - agriyakhetarpal
